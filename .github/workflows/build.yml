name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Smoke test (boot the harness)
        run: npm run smoke

      - name: Build .app + zip (ad-hoc signed)
        run: npm run dist

      - name: Build DMG
        run: ./scripts/make_dmg_only.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Versioned release for a v* tag.
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --generate-notes
          else
            # Rolling "latest" prerelease updated on every main push.
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/*.dmg dist/*.zip \
              --title "DeepSeek Harness (latest)" \
              --notes "Rolling macOS build from commit ${GITHUB_SHA:0:7} — \`.dmg\` + \`.zip\` (ad-hoc signed)." \
              --prerelease --target "$GITHUB_SHA"
          fi
